<!DOCTYPE ang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='assets/imgs/faviconImagen.jpg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/stylesLogin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendors/themify-icons/css/themify-icons.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/notifications.css') }}">
    <title>Registro</title>
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-in-container">
            <form action="#" id="loginForm">
                <h1>Ingresa</h1>
                <input type="email" id="email" color="white" placeholder="Correo electrónico" />
                <input type="password" id="clave" color="white" placeholder="Clave" />
                <a href="{{ url_for('olvidar_contrasena')}} ">Olvidaste tu contraseña?</a>
                <button type="button" class="login-button" onclick="sendCredentialsAccess()">Ingresar</button>
                <div class="mobile-signup">
                    <p>¿No tienes una cuenta?</p>
                    <button type="button" class="ghost mobile-only" onclick="irARegistro()">Registrarme</button>
                </div>
            </form>

            <!-- Formulario de cambio de contraseña (inicialmente oculto) -->
            <form action="#" id="changePasswordForm" style="display: none;">
                <h2>Cambiar Contraseña Temporal</h2>
                <input type="password" id="currentPassword" placeholder="Contraseña temporal (token)" />
                <input type="password" id="newPassword" placeholder="Nueva contraseña" />
                <input type="password" id="confirmPassword" placeholder="Confirmar nueva contraseña" />
                <div class="button-group">
                    <button type="button" onclick="updatePassword()">Actualizar Contraseña</button>
                    <button type="button" class="ghost" onclick="skipPasswordChange()">Mantener Contraseña Temporal</button>
                </div>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-right">
                    <h1>Hola!</h1>
                    <p>Ingresa tus datos para crear tu cuenta</p>
                    <button class="ghost" id="signUp">Registrarme</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Contenedor de notificaciones -->
        <div id="notificacionContainer" class="notificacion-container"></div>
    
    <!-- Spinner de carga para login -->
    <div id="spinnerOverlay" class="login-spinner-overlay">
        <div class="login-spinner"></div>
    </div>
</body>
    
    <!-- Spinner de carga -->
    <div id="spinnerOverlay" class="spinner-overlay">
        <div class="spinner"></div>
    </div>
</body>
<script src="{{ url_for('static', filename='assets/js/notifications.js') }}"></script>
<script>
    async function sendCredentialsAccess() {
        const url = '/api/sendCredentialsAccess';
        const correo = document.getElementById('email').value;
        const clave = document.getElementById('clave').value;
        const loginButton = document.querySelector('button[onclick="sendCredentialsAccess()"]');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        
        if (!correo || !clave) {
            mostrarNotificacion('Por favor ingrese correo y contraseña', 'error');
            return;
        }
        
        // Desactivar el botón y mostrar spinner
        loginButton.disabled = true;
        spinnerOverlay.style.display = 'flex';
        
        const data = {
            correo: correo,
            clave: clave
        };

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // Timeout después de 10 segundos
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(data),
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);
            const result = await response.json();
            
            if (result.status === "success") {
                if (result.data.token_recuperacion) {
                    // Si hay un token de recuperación, mostrar el formulario de cambio de contraseña
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('changePasswordForm').style.display = 'block';
                } else {
                    // Redireccionar según el tipo de usuario
                    if (result.data.tipo_usuario === "0") {
                        window.location.href = '/clientes';
                    } else if (result.data.tipo_usuario === "1") {
                        window.location.href = '/empleado';
                    } else if (result.data.tipo_usuario === "2") {
                        window.location.href = '/admin';
                    }
                }
            } else {
                mostrarNotificacion(result.message, 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            if (error.name === 'AbortError') {
                mostrarNotificacion('La conexión está tardando demasiado. Por favor, intente nuevamente.', 'error');
            } else {
                mostrarNotificacion('Error al iniciar sesión', 'error');
            }
        } finally {
            // Restaurar el botón y ocultar spinner
            loginButton.disabled = false;
            spinnerOverlay.style.display = 'none';
        }
    }

    function irARegistro() {
        window.location.href = "{{ url_for('registrarse') }}";
    }

    document.getElementById('signUp').addEventListener('click', function() {
        irARegistro();
    });

    async function updatePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const email = document.getElementById('email').value;

        if (newPassword !== confirmPassword) {
            mostrarNotificacion('Las contraseñas nuevas no coinciden', 'error');
            return;
        }

        try {
            const response = await fetch('/api/actualizar-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    email: email,
                    current_password: currentPassword,
                    new_password: newPassword
                })
            });

            const result = await response.json();
            if (result.status === 'success') {
                mostrarNotificacion('Contraseña actualizada exitosamente', 'success');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                mostrarNotificacion(result.message || 'Error al actualizar la contraseña', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            mostrarNotificacion('Error al actualizar la contraseña', 'error');
        }
    }

    function skipPasswordChange() {
        const userType = "{{ session.get('user_type', '0') }}";
        if (userType === "0") {
            window.location.href = '/clientes';
        } else if (userType === "1") {
            window.location.href = '/empleado';
        } else if (userType === "2") {
            window.location.href = '/admin';
        }
    }
</script>
</html>
